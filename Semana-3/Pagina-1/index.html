<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Minimalista</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
    </style>
</head>
<body class="bg-[#09090b] text-white flex items-center justify-center min-h-screen p-4 antialiased">
    <div class="w-full max-w-sm bg-[#18181b]/80 backdrop-blur-2xl border border-zinc-800/80 rounded-3xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.6)] space-y-6">
        <!-- Apple window header decor -->
        <div class="flex items-center space-x-2 pb-1 border-b border-zinc-800/50">
            <div class="w-3 h-3 rounded-full bg-[#ff5f56]"></div>
            <div class="w-3 h-3 rounded-full bg-[#ffbd2e]"></div>
            <div class="w-3 h-3 rounded-full bg-[#27c93f]"></div>
            <span class="text-[11px] text-zinc-500 font-medium pl-2 tracking-wider">CALCULADORA</span>
        </div>

        <form action="#">
            <div class="space-y-4">
                <!-- Input 1 -->
                <div class="flex flex-col space-y-1.5">
                    <label for="numero_1" class="text-xs font-semibold text-zinc-400 uppercase tracking-wider pl-1">Número 1</label>
                    <input type="number" id="numero_1" name="numero_1" placeholder="0"
                        class="w-full bg-[#27272a]/50 text-white text-xl px-4 py-3 rounded-2xl border border-zinc-800 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all placeholder-zinc-600">
                </div>

                <!-- Input 2 -->
                <div class="flex flex-col space-y-1.5">
                    <label for="numero_2" class="text-xs font-semibold text-zinc-400 uppercase tracking-wider pl-1">Número 2</label>
                    <input type="number" id="numero_2" name="numero_2" placeholder="0"
                        class="w-full bg-[#27272a]/50 text-white text-xl px-4 py-3 rounded-2xl border border-zinc-800 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all placeholder-zinc-600">
                </div>
            </div>

            <!-- Resultado Display -->
            <div class="bg-black/40 rounded-2xl p-4 border border-zinc-800/40 flex flex-col justify-end min-h-[76px] text-right mt-5">
                <span class="text-[10px] text-zinc-500 uppercase tracking-wider font-bold block mb-1 text-left">Resultado</span>
                <p id="resultado" class="text-3xl font-light text-orange-500 tracking-tight break-all truncate">0</p>
            </div>

            <!-- Botones de Operación Estilo Apple -->
            <div class="grid grid-cols-2 gap-3 mt-6">
                <button type="button" id="suma" 
                    class="flex items-center justify-center py-3.5 rounded-2xl bg-zinc-800/80 hover:bg-zinc-700/80 active:scale-95 text-white font-medium text-lg transition-all border border-zinc-700/20 shadow-sm">
                    Sumar
                </button>
                <button type="button" id="resta" 
                    class="flex items-center justify-center py-3.5 rounded-2xl bg-zinc-800/80 hover:bg-zinc-700/80 active:scale-95 text-white font-medium text-lg transition-all border border-zinc-700/20 shadow-sm">
                    Restar
                </button>
                <button type="button" id="multiplicacion" 
                    class="flex items-center justify-center py-3.5 rounded-2xl bg-zinc-800/80 hover:bg-zinc-700/80 active:scale-95 text-white font-medium text-lg transition-all border border-zinc-700/20 shadow-sm">
                    Multiplicar
                </button>
                <button type="button" id="division" 
                    class="flex items-center justify-center py-3.5 rounded-2xl bg-orange-500 hover:bg-orange-400 active:scale-95 text-white font-medium text-lg transition-all shadow-md shadow-orange-500/10">
                    Dividir
                </button>
            </div>

            <script src="script.js"></script>
            <script src="operaciones.js"></script>
        </form>
    </div>
</body>
</html>
