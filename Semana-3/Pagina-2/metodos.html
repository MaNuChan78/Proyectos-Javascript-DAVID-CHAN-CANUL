<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen flex items-center justify-center font-sans p-4">
    <div class="bg-neutral-900 border border-neutral-800 p-8 rounded-2xl shadow-2xl w-full max-w-sm flex flex-col gap-6">
        <h1 class="text-xl font-semibold text-center text-white tracking-wide">Analizador de Números</h1>
        
        <div>
            <label for="numero" class="block text-xs font-medium text-neutral-400 uppercase tracking-wider mb-2">Introduce un número</label>
            <input type="number" id="numero" class="w-full bg-neutral-950 border border-neutral-800 rounded-lg py-3 px-4 text-center text-xl font-mono text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" placeholder="0">
        </div>

        <button id="boton" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition-all duration-150 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-indigo-600/20 tracking-wide uppercase text-sm">Verificar Número</button>
        
        <div class="border-t border-neutral-800 pt-6">
            <span class="block text-xs font-medium text-neutral-400 uppercase tracking-wider mb-2 text-center">Resultado</span>
            <p id="resultado" class="text min-h-[56px] bg-neutral-950 border border-neutral-800 rounded-lg p-3 text-center text-sm font-medium text-indigo-300 flex items-center justify-center"></p>
        </div>
    </div>

    <script src="Funciones.js"></script>
    <script src="Script.js"></script>
</body>
</html>
